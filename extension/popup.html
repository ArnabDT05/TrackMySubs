<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TrackMySubs</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-card">
      <div class="header">
        <h3>TrackMySubs</h3>
      </div>
      <div id="status" class="status-msg"></div>
      <form id="sub-form">
        <div class="form-group">
          <label for="name">Service Name</label>
          <input type="text" id="name" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="price">Price ($)</label>
            <input type="number" id="price" step="0.01" min="0" required />
          </div>
          <div class="form-group">
            <label for="billingCycle">Cycle</label>
            <select id="billingCycle">
              <option value="weekly">Weekly</option>
              <option value="monthly" selected>Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
            <option value="Dev Tools">Dev Tools</option>
            <option value="Health">Health</option>
            <option value="Other" selected>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="paymentMethod">Payment Method</label>
          <input type="text" id="paymentMethod" list="payment-options" placeholder="e.g. Visa 4242" />
          <datalist id="payment-options">
            <option value="Visa 4242"></option>
            <option value="Mastercard 9999"></option>
            <option value="PayPal"></option>
            <option value="Cash/Unlinked"></option>
          </datalist>
        </div>
        <div class="form-group checkbox-row">
          <input type="checkbox" id="isTrial" />
          <label for="isTrial">Is this a free trial?</label>
        </div>
        <button type="submit" id="save-btn">Save Subscription</button>
      </form>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
